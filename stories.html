<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Short Stories - Cristiane Souza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <div class="logo">CS</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="industry.html">Industry</a></li>
            <li><a href="academia.html">Academia</a></li>
            <li><a href="stories.html" class="active">Short Stories</a></li>
            <li><a href="contact.html">Finding Cris</a></li>
        </ul>
    </nav>

    <main class="page-container">
        <header class="page-header page-hero-panel">
            <p class="eyebrow">Writing</p>
            <h1>Short Stories</h1>
            <div class="accent-line"></div>
            <p>White papers, essays, and perspectives shared on LinkedIn and Twitter.</p>
        </header>

        <div id="storiesContainer" class="content-grid soft-grid">
            <div class="card soft-card">
                <p class="status-message">Loading stories...</p>
            </div>
        </div>
    </main>

    <script src="js/main.js"></script>
    <script>
        async function loadStories() {
            try {
                // Fetch stories directory from GitHub
                const response = await fetch(
                    'https://api.github.com/repos/souza-cris/souza-cris.github.io/contents/stories'
                );

                if (!response.ok) {
                    // No stories yet
                    document.getElementById('storiesContainer').innerHTML = `
                        <div class="card soft-card">
                            <p class="status-message">No stories published yet. Check back soon!</p>
                        </div>
                    `;
                    return;
                }

                const files = await response.json();
                const storyFiles = files.filter(f => f.name.endsWith('.md'));

                if (storyFiles.length === 0) {
                    document.getElementById('storiesContainer').innerHTML = `
                        <div class="card soft-card">
                            <p class="status-message">No stories published yet. Check back soon!</p>
                        </div>
                    `;
                    return;
                }

                // Fetch and parse each story
                const stories = await Promise.all(
                    storyFiles.map(async file => {
                        const contentResponse = await fetch(file.download_url);
                        const markdown = await contentResponse.text();
                        
                        // Parse frontmatter
                        const frontmatterMatch = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
                        let title = 'Untitled';
                        let date = new Date();
                        let status = 'published';
                        let excerpt = '';

                        if (frontmatterMatch) {
                            const frontmatter = frontmatterMatch[1];
                            const content = frontmatterMatch[2];

                            const titleMatch = frontmatter.match(/title:\s*(.+)/);
                            const dateMatch = frontmatter.match(/date:\s*(.+)/);
                            const statusMatch = frontmatter.match(/status:\s*(.+)/);

                            if (titleMatch) title = titleMatch[1];
                            if (dateMatch) date = new Date(dateMatch[1]);
                            if (statusMatch) status = statusMatch[1];

                            // Get first paragraph as excerpt
                            const firstPara = content.trim().split('\n\n')[0];
                            excerpt = firstPara.substring(0, 150) + (firstPara.length > 150 ? '...' : '');
                        }

                        return {
                            slug: file.name.replace('.md', ''),
                            title,
                            date,
                            status,
                            excerpt
                        };
                    })
                );

                // Filter only published and sort by date
                const published = stories
                    .filter(s => s.status === 'published')
                    .sort((a, b) => b.date - a.date);

                if (published.length === 0) {
                    document.getElementById('storiesContainer').innerHTML = `
                        <div class="card soft-card">
                            <p class="status-message">No stories published yet. Check back soon!</p>
                        </div>
                    `;
                    return;
                }

                // Render stories
                document.getElementById('storiesContainer').innerHTML = published.map(story => `
                    <div class="card soft-card">
                        <h3><a href="story.html?slug=${story.slug}">${story.title}</a></h3>
                        <p class="story-date">${story.date.toLocaleDateString('en-US', {
                            year: 'numeric',
                            month: 'long',
                            day: 'numeric'
                        })}</p>
                        <p>${story.excerpt}</p>
                        <div class="story-readmore">
                            <a href="story.html?slug=${story.slug}">Read more →</a>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading stories:', error);
                document.getElementById('storiesContainer').innerHTML = `
                    <div class="card soft-card">
                        <p class="status-message">Error loading stories. Please try again later.</p>
                    </div>
                `;
            }
        }

        loadStories();
    </script>
</body>
</html>
