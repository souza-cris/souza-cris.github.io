<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Admin</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        .editor-section {
            background: var(--white);
            border: 1px solid var(--gray-light);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            color: var(--gray-dark);
            margin-bottom: 0.5rem;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--gray-light);
            border-radius: 4px;
            font-family: inherit;
            font-size: 1rem;
        }

        .form-group textarea {
            min-height: 400px;
            font-family: 'Monaco', 'Courier New', monospace;
            line-height: 1.6;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--teal);
            color: var(--white);
        }

        .btn-primary:hover {
            background: var(--sage);
        }

        .btn-secondary {
            background: var(--gray-light);
            color: var(--gray-dark);
        }

        .btn-secondary:hover {
            background: var(--gray-medium);
            color: var(--white);
        }

        .btn-gold {
            background: var(--gold);
            color: var(--white);
        }

        .btn-gold:hover {
            opacity: 0.9;
        }

        .stories-list {
            margin-top: 3rem;
        }

        .story-item {
            padding: 1rem;
            border: 1px solid var(--gray-light);
            border-radius: 4px;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .story-item.draft {
            background: var(--gray-light);
        }

        .story-item.published {
            background: var(--white);
        }

        .story-info h4 {
            margin: 0 0 0.25rem 0;
            color: var(--gray-dark);
        }

        .story-info .meta {
            font-size: 0.875rem;
            color: var(--gray-medium);
        }

        .story-actions {
            display: flex;
            gap: 0.5rem;
        }

        .story-actions button {
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 500;
            margin-left: 0.5rem;
        }

        .status-badge.draft {
            background: var(--gray-light);
            color: var(--gray-dark);
        }

        .status-badge.published {
            background: var(--teal);
            color: var(--white);
        }

        .settings-section {
            background: var(--gray-light);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .settings-section h3 {
            margin-top: 0;
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <nav>
        <div class="logo">CS Admin</div>
        <ul class="nav-links">
            <li><a href="index.html">← Back to Site</a></li>
        </ul>
    </nav>

    <div class="admin-container">
        <h1>Story Manager</h1>
        <div class="accent-line"></div>

        <div id="alert" class="alert hidden"></div>

        <!-- Settings -->
        <div class="settings-section">
            <h3>GitHub Settings</h3>
            <div class="form-group">
                <label>GitHub Personal Access Token</label>
                <input type="password" id="githubToken" placeholder="ghp_...">
                <small style="color: var(--gray-medium); display: block; margin-top: 0.5rem;">
                    Create at: <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a> (needs 'repo' scope)
                </small>
            </div>
        </div>

        <!-- Editor -->
        <div class="editor-section">
            <h2>Write Story</h2>
            
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="storyTitle" placeholder="My Story Title">
            </div>

            <div class="form-group">
                <label>Slug (URL-friendly name)</label>
                <input type="text" id="storySlug" placeholder="my-story-title">
                <small style="color: var(--gray-medium);">Auto-generated from title, but you can customize</small>
            </div>

            <div class="form-group">
                <label>Content (Markdown supported)</label>
                <textarea id="storyContent" placeholder="Write your story here...

You can use Markdown:
- **bold**
- *italic*
- [links](https://example.com)
- etc."></textarea>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select id="storyStatus">
                    <option value="draft">Draft</option>
                    <option value="published">Published</option>
                </select>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" onclick="saveStory()">Save Story</button>
                <button class="btn btn-gold" onclick="publishAndShare()" id="publishBtn" disabled>
                    Publish & Share to Social
                </button>
                <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
            </div>
        </div>

        <!-- Stories List -->
        <div class="stories-list">
            <h2>Your Stories</h2>
            <div id="storiesList">
                <p style="color: var(--gray-medium);">Loading stories...</p>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        // Auto-generate slug from title
        document.getElementById('storyTitle').addEventListener('input', (e) => {
            const slug = e.target.value
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
            document.getElementById('storySlug').value = slug;
        });

        // Enable publish button only when status is published
        document.getElementById('storyStatus').addEventListener('change', (e) => {
            document.getElementById('publishBtn').disabled = e.target.value !== 'published';
        });

        // Local storage for drafts and settings
        function getSettings() {
            return {
                githubToken: localStorage.getItem('githubToken') || '',
                repo: 'souza-cris/souza-cris.github.io',
                branch: 'main'
            };
        }

        function saveSettings() {
            const token = document.getElementById('githubToken').value;
            localStorage.setItem('githubToken', token);
        }

        function loadSettings() {
            const settings = getSettings();
            document.getElementById('githubToken').value = settings.githubToken;
        }

        function showAlert(message, type = 'success') {
            const alert = document.getElementById('alert');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            alert.classList.remove('hidden');
            setTimeout(() => alert.classList.add('hidden'), 5000);
        }

        async function saveStory() {
            saveSettings();
            
            const title = document.getElementById('storyTitle').value;
            const slug = document.getElementById('storySlug').value;
            const content = document.getElementById('storyContent').value;
            const status = document.getElementById('storyStatus').value;

            if (!title || !slug || !content) {
                showAlert('Please fill in all fields', 'error');
                return;
            }

            const story = {
                title,
                slug,
                content,
                status,
                date: new Date().toISOString(),
                updated: new Date().toISOString()
            };

            // Save to localStorage for drafts
            const stories = getStories();
            stories[slug] = story;
            localStorage.setItem('stories', JSON.stringify(stories));

            // If published, commit to GitHub
            if (status === 'published') {
                await commitToGitHub(story);
            }

            showAlert(`Story "${title}" saved as ${status}!`);
            loadStories();
        }

        async function commitToGitHub(story) {
            const settings = getSettings();
            
            if (!settings.githubToken) {
                showAlert('Please set your GitHub token in settings', 'error');
                return;
            }

            const fileContent = `---
title: ${story.title}
date: ${story.date}
status: ${story.status}
---

${story.content}
`;

            const path = `stories/${story.slug}.md`;
            const message = `Add story: ${story.title}`;

            try {
                // Get current file SHA if exists (for updates)
                let sha = null;
                try {
                    const getResponse = await fetch(
                        `https://api.github.com/repos/${settings.repo}/contents/${path}`,
                        {
                            headers: {
                                'Authorization': `token ${settings.githubToken}`,
                                'Accept': 'application/vnd.github.v3+json'
                            }
                        }
                    );
                    if (getResponse.ok) {
                        const data = await getResponse.json();
                        sha = data.sha;
                    }
                } catch (e) {
                    // File doesn't exist yet
                }

                // Create or update file
                const response = await fetch(
                    `https://api.github.com/repos/${settings.repo}/contents/${path}`,
                    {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${settings.githubToken}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message,
                            content: btoa(unescape(encodeURIComponent(fileContent))),
                            branch: settings.branch,
                            ...(sha && { sha })
                        })
                    }
                );

                if (!response.ok) {
                    throw new Error('Failed to commit to GitHub');
                }

                showAlert('Story published to GitHub!');
            } catch (error) {
                showAlert(`Error: ${error.message}`, 'error');
            }
        }

        async function publishAndShare() {
            await saveStory();
            
            const title = document.getElementById('storyTitle').value;
            const slug = document.getElementById('storySlug').value;
            const url = `https://souza-cris.github.io/story.html?slug=${slug}`;
            
            // For now, just copy link - social API integration comes later
            const shareText = `New story: ${title}\n\n${url}`;
            
            if (navigator.clipboard) {
                await navigator.clipboard.writeText(shareText);
                showAlert('Story published! Share text copied to clipboard. Paste in LinkedIn/Twitter.');
            } else {
                showAlert('Story published! Share manually on social media.');
            }
            
            // TODO: Add LinkedIn & Twitter API auto-posting here
        }

        function getStories() {
            const stored = localStorage.getItem('stories');
            return stored ? JSON.parse(stored) : {};
        }

        function loadStories() {
            const stories = getStories();
            const container = document.getElementById('storiesList');
            
            if (Object.keys(stories).length === 0) {
                container.innerHTML = '<p style="color: var(--gray-medium);">No stories yet. Write your first one above!</p>';
                return;
            }

            const sorted = Object.values(stories).sort((a, b) => 
                new Date(b.updated) - new Date(a.updated)
            );

            container.innerHTML = sorted.map(story => `
                <div class="story-item ${story.status}">
                    <div class="story-info">
                        <h4>
                            ${story.title}
                            <span class="status-badge ${story.status}">${story.status}</span>
                        </h4>
                        <div class="meta">
                            ${new Date(story.updated).toLocaleDateString()}
                        </div>
                    </div>
                    <div class="story-actions">
                        <button class="btn btn-secondary" onclick="editStory('${story.slug}')">Edit</button>
                        <button class="btn btn-secondary" onclick="deleteStory('${story.slug}')">Delete</button>
                    </div>
                </div>
            `).join('');
        }

        function editStory(slug) {
            const stories = getStories();
            const story = stories[slug];
            
            document.getElementById('storyTitle').value = story.title;
            document.getElementById('storySlug').value = story.slug;
            document.getElementById('storyContent').value = story.content;
            document.getElementById('storyStatus').value = story.status;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteStory(slug) {
            if (!confirm('Delete this story?')) return;
            
            const stories = getStories();
            delete stories[slug];
            localStorage.setItem('stories', JSON.stringify(stories));
            
            showAlert('Story deleted');
            loadStories();
        }

        function clearForm() {
            document.getElementById('storyTitle').value = '';
            document.getElementById('storySlug').value = '';
            document.getElementById('storyContent').value = '';
            document.getElementById('storyStatus').value = 'draft';
        }

        // Initialize
        loadSettings();
        loadStories();

        // Save token when changed
        document.getElementById('githubToken').addEventListener('change', saveSettings);
    </script>
</body>
</html>
