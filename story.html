<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story - Cristiane Souza</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav>
        <div class="logo">CS</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="industry.html">Industry</a></li>
            <li><a href="academia.html">Academia</a></li>
            <li><a href="stories.html" class="active">Short Stories</a></li>
            <li><a href="contact.html">Finding Cris</a></li>
        </ul>
    </nav>

    <div class="story-container">
        <div id="storyContent" class="loading card soft-card">
            Loading story...
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function loadStory() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                document.getElementById('storyContent').innerHTML = `
                    <div class="story-header page-hero-panel">
                        <p class="eyebrow">Writing</p>
                        <h1>Story not found</h1>
                    </div>
                    <p class="story-back-link"><a href="stories.html">← Back to all stories</a></p>
                `;
                return;
            }

            try {
                // Fetch story from GitHub
                const response = await fetch(
                    `https://raw.githubusercontent.com/souza-cris/souza-cris.github.io/main/stories/${slug}.md`
                );

                if (!response.ok) {
                    throw new Error('Story not found');
                }

                const markdown = await response.text();

                // Parse frontmatter
                const frontmatterMatch = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
                let title = 'Untitled';
                let date = '';
                let content = markdown;

                if (frontmatterMatch) {
                    const frontmatter = frontmatterMatch[1];
                    content = frontmatterMatch[2];

                    const titleMatch = frontmatter.match(/title:\s*(.+)/);
                    const dateMatch = frontmatter.match(/date:\s*(.+)/);

                    if (titleMatch) title = titleMatch[1];
                    if (dateMatch) date = new Date(dateMatch[1]).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }

                // Convert markdown to HTML
                const html = marked.parse(content);

                // Build page
                const shareUrl = window.location.href;
                const shareText = encodeURIComponent(title);
                
                document.getElementById('storyContent').innerHTML = `
                    <div class="story-header page-hero-panel">
                        <p class="eyebrow">Story</p>
                        <h1>${title}</h1>
                        <div class="accent-line"></div>
                        ${date ? `<p class="story-date">${date}</p>` : ''}
                    </div>

                    <div class="story-content">
                        ${html}
                    </div>

                    <div class="share-section">
                        <h3>Share this story</h3>
                        <div class="share-buttons">
                            <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}" 
                               target="_blank" 
                               class="share-btn share-btn-linkedin">
                                <span>💼</span>
                                <span>Share on LinkedIn</span>
                            </a>
                            <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${encodeURIComponent(shareUrl)}" 
                               target="_blank" 
                               class="share-btn share-btn-twitter">
                                <span>🐦</span>
                                <span>Share on Twitter</span>
                            </a>
                        </div>
                    </div>

                    <p class="story-back-link"><a href="stories.html">← Back to all stories</a></p>
                `;

                // Update page title
                document.title = `${title} - Cristiane Souza`;

            } catch (error) {
                document.getElementById('storyContent').innerHTML = `
                    <div class="story-header page-hero-panel">
                        <p class="eyebrow">Writing</p>
                        <h1>Story not found</h1>
                    </div>
                    <p>The story you're looking for doesn't exist or hasn't been published yet.</p>
                    <p class="story-back-link"><a href="stories.html">← Back to all stories</a></p>
                `;
            }
        }

        loadStory();
    </script>
</body>
</html>
