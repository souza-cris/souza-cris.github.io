<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story - Cristiane Souza</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .story-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 8rem 2rem 4rem;
        }

        .story-header {
            margin-bottom: 3rem;
        }

        .story-date {
            color: var(--gray-medium);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .story-content {
            line-height: 1.8;
            font-size: 1.125rem;
        }

        .story-content h2 {
            margin-top: 2.5rem;
            margin-bottom: 1rem;
        }

        .story-content h3 {
            margin-top: 2rem;
            margin-bottom: 0.75rem;
        }

        .story-content p {
            margin-bottom: 1.5rem;
        }

        .story-content a {
            color: var(--teal);
            text-decoration: underline;
        }

        .story-content code {
            background: var(--gray-light);
            padding: 0.2rem 0.4rem;
            border-radius: 3px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 0.9em;
        }

        .story-content pre {
            background: var(--gray-light);
            padding: 1rem;
            border-radius: 4px;
            overflow-x: auto;
        }

        .story-content pre code {
            background: none;
            padding: 0;
        }

        .share-section {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 2px solid var(--gray-light);
        }

        .share-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .share-btn-linkedin {
            background: #0077B5;
            color: white;
        }

        .share-btn-linkedin:hover {
            background: #006399;
            color: white;
        }

        .share-btn-twitter {
            background: #1DA1F2;
            color: white;
        }

        .share-btn-twitter:hover {
            background: #1a8cd8;
            color: white;
        }

        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--gray-medium);
        }
    </style>
    <!-- Markdown parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <nav>
        <div class="logo">CS</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="industry.html">Industry</a></li>
            <li><a href="academia.html">Academia</a></li>
            <li><a href="stories.html" class="active">Short Stories</a></li>
            <li><a href="contact.html">Finding Cris</a></li>
        </ul>
    </nav>

    <div class="story-container">
        <div id="storyContent" class="loading">
            Loading story...
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        async function loadStory() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');

            if (!slug) {
                document.getElementById('storyContent').innerHTML = `
                    <div class="story-header">
                        <h1>Story not found</h1>
                    </div>
                    <p><a href="stories.html">← Back to all stories</a></p>
                `;
                return;
            }

            try {
                // Fetch story from GitHub
                const response = await fetch(
                    `https://raw.githubusercontent.com/souza-cris/souza-cris.github.io/main/stories/${slug}.md`
                );

                if (!response.ok) {
                    throw new Error('Story not found');
                }

                const markdown = await response.text();

                // Parse frontmatter
                const frontmatterMatch = markdown.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
                let title = 'Untitled';
                let date = '';
                let content = markdown;

                if (frontmatterMatch) {
                    const frontmatter = frontmatterMatch[1];
                    content = frontmatterMatch[2];

                    const titleMatch = frontmatter.match(/title:\s*(.+)/);
                    const dateMatch = frontmatter.match(/date:\s*(.+)/);

                    if (titleMatch) title = titleMatch[1];
                    if (dateMatch) date = new Date(dateMatch[1]).toLocaleDateString('en-US', {
                        year: 'numeric',
                        month: 'long',
                        day: 'numeric'
                    });
                }

                // Convert markdown to HTML
                const html = marked.parse(content);

                // Build page
                const shareUrl = window.location.href;
                const shareText = encodeURIComponent(title);
                
                document.getElementById('storyContent').innerHTML = `
                    <div class="story-header">
                        <h1>${title}</h1>
                        <div class="accent-line"></div>
                        ${date ? `<p class="story-date">${date}</p>` : ''}
                    </div>

                    <div class="story-content">
                        ${html}
                    </div>

                    <div class="share-section">
                        <h3>Share this story</h3>
                        <div class="share-buttons">
                            <a href="https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}" 
                               target="_blank" 
                               class="share-btn share-btn-linkedin">
                                <span>💼</span>
                                <span>Share on LinkedIn</span>
                            </a>
                            <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${encodeURIComponent(shareUrl)}" 
                               target="_blank" 
                               class="share-btn share-btn-twitter">
                                <span>🐦</span>
                                <span>Share on Twitter</span>
                            </a>
                        </div>
                    </div>

                    <p style="margin-top: 3rem;"><a href="stories.html">← Back to all stories</a></p>
                `;

                // Update page title
                document.title = `${title} - Cristiane Souza`;

            } catch (error) {
                document.getElementById('storyContent').innerHTML = `
                    <div class="story-header">
                        <h1>Story not found</h1>
                    </div>
                    <p>The story you're looking for doesn't exist or hasn't been published yet.</p>
                    <p><a href="stories.html">← Back to all stories</a></p>
                `;
            }
        }

        loadStory();
    </script>
</body>
</html>
